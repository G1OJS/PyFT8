[project]
name = "PyFT8"
version = "4.0.3"
license = "GPL-3.0-or-later"

authors = [
  { name="G1OJS", email="g1ojs@yahoo.com" },
]
description = "All-Python FT8 Transceiver with separable Transmitter and Receiver"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24.0",
    "pyaudio",
    "paho-mqtt"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

keywords = ["ham radio", "radio", "FT8", "LDPC", "CPMFSK"]

[project.urls]
Homepage = "https://github.com/G1OJS/PyFT8m"
Issues = "https://github.com/G1OJS/PyFT8m/issues"

[tool.setuptools]
packages = ["PyFT8"]
license-files = ["LICENSE"]

[project.scripts]
pyft8gui = "PyFT8.tk_gui:run"
